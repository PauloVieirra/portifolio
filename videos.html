<script>
/* Preview frames sized to the page height report a viewport taller than the monitor; pin --vh to the monitor there */
(() => {
  const root = document.documentElement;
  const fit = () => {
    const canvas = innerHeight > Math.max(screen.availHeight || 0, 1400);
    root.classList.toggle('is-canvas', canvas);
    if (canvas) root.style.setProperty('--vh', `${Math.min(screen.availHeight || 900, 1080) / 100}px`);
    else root.style.removeProperty('--vh');
  };
  fit();
  addEventListener('resize', fit);
})();
</script>
<!-- Page content is loaded from Supabase: <main> stays hidden until it is rendered (is-ready, set by the page module);
     the timer shows it anyway if the module ever fails -->
<style>html:not(.is-ready) main{visibility:hidden}</style>
<script>setTimeout(() => document.documentElement.classList.add('is-ready'), 4000)</script>
